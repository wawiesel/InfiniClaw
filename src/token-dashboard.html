<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token Usage __TITLE_SUFFIX__</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:13px/1.5 'SF Mono',monospace;display:flex;height:100vh}
  .sidebar{width:170px;min-width:170px;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;overflow-y:auto;position:sticky;top:0;height:100vh}
  .sidebar h3{padding:8px 14px 2px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .sidebar a{display:block;padding:3px 14px;color:var(--text);text-decoration:none;font-size:11px;border-left:2px solid transparent;cursor:pointer}
  .sidebar a:hover{background:var(--bg);color:var(--blue)}
  .sidebar a.active{color:var(--blue);border-left-color:var(--blue);background:var(--bg)}
  .main{flex:1;padding:20px;overflow-y:auto;scroll-behavior:smooth;scroll-padding-top:20px}
  h1{font-size:16px;color:var(--blue);margin-bottom:16px}
  .section{margin-bottom:32px;scroll-margin-top:20px}
  .section h2{font-size:14px;color:var(--text);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px}
  .tab-bar{display:flex;gap:0;margin-bottom:-1px;position:relative;z-index:1;flex-wrap:wrap}
  .tab-btn{padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-bottom:none;color:var(--muted);cursor:pointer;font:11px/1.5 inherit;border-radius:4px 4px 0 0}
  .tab-btn.active{background:var(--surface);color:var(--blue);border-bottom-color:var(--surface)}
  table{border-collapse:collapse;width:auto;margin-top:8px}
  th{text-align:left;color:var(--muted);font-size:10px;padding:2px 8px;border-bottom:1px solid var(--border)}
  td{padding:3px 8px;border-bottom:1px solid var(--border);font-size:11px}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted);font-size:10px}
  footer{margin-top:24px;color:var(--muted);font-size:10px;padding-bottom:80vh}
</style>
</head>
<body>
<nav class="sidebar" id="sidebar"></nav>
<div class="main" id="main">
  <h1>Fleet Token Usage __TITLE_SUFFIX__</h1>
  <div class="card" id="livestream-card" style="max-height:180px;overflow-y:auto;font-size:11px;margin-bottom:12px">
    <div style="color:var(--muted);font-size:10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center">
      <span>Live Stream</span>
      <button onclick="document.getElementById('livestream').innerHTML='';fetch(BASE+'/tokens/stream/clear',{method:'POST'})" style="background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:9px;padding:1px 6px;border-radius:3px;cursor:pointer">Clear</button>
    </div>
    <div id="livestream">Waiting for data...</div>
  </div>
  <div id="content">Loading...</div>
  <footer id="ts"></footer>
</div>

<script>
const BASE='__BASE__';
const HA_MIN=1/3600; // 1 second in hours — right edge of log x-axis
const HA_MAX=168;     // 7 days in hours — left edge of log x-axis
const GRN_MS=__GRANULARITY_S__*1000; // plot granularity in ms — snap grid to wall clock
const MC={'claude-sonnet-4-6':'#58a6ff','claude-opus-4-6':'#bc8cff','qwen3:14b':'#3fb950','qwen3:30b':'#2ea043','claude-haiku-4-5':'#f0883e'};
const DC='#8b949e';
const SHIP_PALETTE=['#58a6ff','#f0883e','#bc8cff','#3fb950','#da3633','#d29922'];
const _shipColorMap={};let _shipColorIdx=0;
function shipColor(name){if(!_shipColorMap[name])_shipColorMap[name]=SHIP_PALETTE[_shipColorIdx++%SHIP_PALETTE.length];return _shipColorMap[name];}

// ── Turn: one LLM turn contributing R_{bsxk}(t) = tokens / duration for t in [tStart, tEnd) ──
// Carries pricePerToken so cost rate can be computed on the union grid:
//   $R(t) = sum_active_turns[ R_i(t) * pricePerToken_i ]
class Turn{
  constructor(tStart,tEnd,tokens,pricePerToken){
    this.tStart=tStart;this.tEnd=tEnd;this.tokens=tokens;
    this.ppt=pricePerToken||0; // $/token for this turn's token type
  }
  get durationHrs(){return(this.tEnd-this.tStart)/3600000;}
  get rate(){return this.durationHrs>0?this.tokens/this.durationHrs:0;}
  // cost rate = token_rate * price_per_token  [$/hr]
  get costRate(){return this.rate*this.ppt;}
  static fromEntry(e,field){
    const tEnd=new Date(e.t_end||e.timestamp).getTime();
    const tStart=new Date(e.t_start||e.timestamp).getTime()||tEnd-30000;
    const tokens=Turn.fieldVal(e,field);
    const ppt=Turn.priceForField(e,field);
    return(tokens>0&&tEnd>tStart)?new Turn(tStart,tEnd,tokens,ppt):null;
  }
  static fieldVal(e,field){
    if(field==='input')return e.input_tokens||0;
    if(field==='output')return e.output_tokens||0;
    if(field==='cache_write')return e.cache_write_tokens||0;
    if(field==='cache_read')return e.cache_read_tokens||0;
    return(e.input_tokens||0)+(e.output_tokens||0)+(e.cache_write_tokens||0);
  }
  // Price per token for this field — from the row's stored prices
  static priceForField(e,field){
    if(field==='input')return e.input_price_per_token||0;
    if(field==='output')return e.output_price_per_token||0;
    if(field==='cache_write')return e.cache_write_price_per_token||0;
    if(field==='cache_read')return e.cache_read_price_per_token||0;
    // total: weighted average price isn't meaningful; compute total cost rate
    // by summing per-type costs. Use a synthetic price = total_cost / total_tokens.
    const tok=(e.input_tokens||0)+(e.output_tokens||0)+(e.cache_write_tokens||0);
    return tok>0?(e.cost||0)/tok:0;
  }
  static fromEntries(entries,field){return entries.map(e=>Turn.fromEntry(e,field)).filter(Boolean);}
}

// ── UnionGrid: shared grid for all traces in a plot ──
// Collects all turn boundaries into {g_0,...,g_N}. Emits epsilon-offset
// point pairs at each boundary for vertical walls on log x-axis.
// Anchored at HA_MAX on the left so fills start from zero.
class UnionGrid{
  // Snap boundary to wall-clock-aligned granularity that coarsens with age.
  // All granularities divide evenly into 60s (or 3600s).
  static _now=Date.now();
  static snap(t){
    const age=(UnionGrid._now-t)/1000;
    let g;
    if(age<300)       g=GRN_MS;          // <5min: base granularity (3s)
    else if(age<3600) g=30000;            // <1hr:  30s
    else if(age<43200)g=300000;           // <12hr: 5min
    else              g=1800000;          // 12hr+: 30min
    return Math.floor(t/g)*g;
  }
  constructor(allTurns,now){
    UnionGrid._now=now||Date.now(); // freeze time for this render cycle
    this.now=UnionGrid.snap(UnionGrid._now);
    const s=new Set([this.now]);
    for(const t of allTurns){s.add(UnionGrid.snap(t.tStart));s.add(UnionGrid.snap(t.tEnd));}
    this.g=[...s].sort((a,b)=>a-b);
    this.n=this.g.length-1;
  }
  ha(t){return Math.max(HA_MIN,(this.now-t)/3600000);}
  // R_j = sum of active turn token rates on [g_j, g_{j+1})
  rates(turns){
    const S=UnionGrid.snap;
    const r=new Array(this.n);
    for(let j=0;j<this.n;j++){
      let s=0;const lo=this.g[j],hi=this.g[j+1];
      for(const t of turns)if(S(t.tStart)<hi&&S(t.tEnd)>lo)s+=t.rate;
      r[j]=s;
    }
    return r;
  }
  // $R_j = sum of active turns' (token_rate_i * price_per_token_i) [$/hr]
  // Each turn contributes its own price — different models have different costs.
  costRates(turns){
    const S=UnionGrid.snap;
    const r=new Array(this.n);
    for(let j=0;j<this.n;j++){
      let s=0;const lo=this.g[j],hi=this.g[j+1];
      for(const t of turns)if(S(t.tStart)<hi&&S(t.tEnd)>lo)s+=t.costRate;
      r[j]=s;
    }
    return r;
  }
  // Shared x: [HA_MAX, ha(g0), ha(g0+e), ha(g1), ha(g1+e), ..., ha(gN)]
  // Wall offset: max of 1e-6*interval or 100ms absolute — ensures visible wall on log axis.
  x(){
    if(this._x)return this._x;
    const MIN_WALL_MS=100; // absolute minimum wall width in ms
    const x=[HA_MAX];
    for(let j=0;j<=this.n;j++){
      x.push(this.ha(this.g[j]));
      if(j<this.n){
        const dt=this.g[j+1]-this.g[j];
        const offset=Math.max(MIN_WALL_MS, dt*1e-6);
        x.push(this.ha(this.g[j]+offset));
      }
    }
    return this._x=x;
  }
  // Convert rates array → y aligned with x(): [0, prev, cur, prev, cur, ..., last]
  yRateFromRates(r){
    const y=[0];
    for(let j=0;j<=this.n;j++){
      y.push(j>0?r[j-1]:0);
      if(j<this.n)y.push(r[j]);
    }
    return y;
  }
  yRate(turns){return this.yRateFromRates(this.rates(turns));}
  // Cumulative from rates array
  yCumFromRates(r){
    const y=[0];let c=0;
    for(let j=0;j<=this.n;j++){
      y.push(c);
      if(j<this.n){y.push(c);c+=r[j]*(this.g[j+1]-this.g[j])/3600000;}
    }
    return y;
  }
  yCum(turns){return this.yCumFromRates(this.rates(turns));}
}

// ── StackedPlot: builds Plotly traces from a seriesMap ──
// Token traces: R_{bsxk}(t) per series, stacked on y1
// Cost trace:   $R(t) = sum_active[ R_i(t) * pricePerToken_i ] on y2
// Cost is computed from the SAME token turns — each Turn carries its price.
class StackedPlot{
  constructor(seriesMap,field,mode){
    this.mode=mode;this.field=field;
    this.allTurns=[];
    this.series=[];
    for(const[name,s]of Object.entries(seriesMap)){
      const entries=s.botEntries?[].concat(...s.botEntries):(s.entries||[]);
      const turns=Turn.fromEntries(entries,field);
      this.series.push({name,turns,color:s.color||DC});
      this.allTurns.push(...turns);
    }
    this.grid=this.allTurns.length?new UnionGrid(this.allTurns):null;
  }
  traces(){
    if(!this.grid)return[];
    const x=this.grid.x();
    const isCum=this.mode==='cum';
    const out=[];
    for(const{name,turns,color}of this.series){
      if(!turns.length)continue;
      const y=isCum?this.grid.yCum(turns):this.grid.yRate(turns);
      out.push({x,y:y.map(v=>+v.toFixed(4)),
        type:'scatter',mode:'lines',name,
        fillcolor:color+'40',stackgroup:'tokens',
        line:{color,width:1,shape:'linear'},
        hovertemplate:name+': %{y:,.1f}<extra></extra>'});
    }
    if(this.allTurns.length){
      // Cost from same token turns: $R_j = sum_active[ rate_i * pricePerToken_i ]
      const cr=this.grid.costRates(this.allTurns);
      const y=isCum?this.grid.yCumFromRates(cr):this.grid.yRateFromRates(cr);
      out.push({x,y:y.map(v=>+v.toFixed(6)),
        type:'scatter',mode:'lines',name:'Cost',
        line:{color:'#ffffff',width:1.5,shape:'linear'},
        hovertemplate:'Cost: $%{y:.4f}<extra></extra>',yaxis:'y2',showlegend:false});
    }
    return out;
  }
}

function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function fmtAgo(h){return h<1/60?~~(h*3600)+'s':h<1?~~(h*60)+'m':h<24?~~h+'h':~~(h/24)+'d';}
function fmtNum(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toLocaleString();}

const TICKS=[HA_MIN,10/3600,30/3600,1/60,5/60,15/60,0.5,1,2,4,8,12,24,48,96,HA_MAX];

function makePlot(divId,title,seriesMap,field,mode){
  let traces,yTitle,y2Title;
  if(mode==='ctx'){
    // Context tab: scatter plot of context_tokens per turn, one line per session_id, colored by model
    traces=[];
    const now=Date.now();
    for(const[name,s]of Object.entries(seriesMap)){
      const entries=s.botEntries?[].concat(...s.botEntries):(s.entries||[]);
      // Group by session_id
      const bySess={};
      for(const e of entries){
        const sid=(e.session_id||'').slice(0,8);
        if(!bySess[sid])bySess[sid]=[];
        bySess[sid].push(e);
      }
      for(const[sid,sess]of Object.entries(bySess)){
        const pts=sess.filter(e=>e.context_tokens>0).sort((a,b)=>(a.t_end||a.t_start).localeCompare(b.t_end||b.t_start));
        if(!pts.length)continue;
        const model=pts[0].model||'?';
        traces.push({
          x:pts.map(e=>Math.max(HA_MIN,(now-new Date(e.t_end||e.t_start).getTime())/3600000)),
          y:pts.map(e=>e.context_tokens),
          type:'scatter',mode:'lines+markers',name:sid+' ('+model+')',
          line:{color:MC[model]||s.color||DC,width:1.5},marker:{size:4},
          hovertemplate:sid+': %{y:,.0f} tokens<extra></extra>'
        });
      }
    }
    yTitle='context tokens';y2Title='';
  } else {
    const plot=new StackedPlot(seriesMap,field,mode);
    traces=plot.traces();
    const u=field==='cost'?'$':'tokens';
    yTitle=mode==='cum'?u+' cumulative':u+'/hr';
    y2Title=field==='cost'?'':mode==='cum'?'$ cumulative':'$/hr';
  }
  const now=new Date(),ann=[];
  // Date annotations — all in blue, top of plot
  // "Now" — vertical line + boxed label. Two annotations: line and label separately.
  const nowLx=Math.log10(HA_MIN);
  // Vertical line
  ann.push({x:nowLx,y:0,xref:'x',yref:'paper',ax:nowLx,ay:1,axref:'x',ayref:'paper',
    showarrow:true,arrowhead:0,arrowwidth:1.5,arrowcolor:'#58a6ff'});
  // Boxed label
  ann.push({x:nowLx,y:0.95,xref:'x',yref:'paper',
    text:now.toLocaleString('en-US',{timeZone:'__TIMEZONE__',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}),
    showarrow:false,
    font:{size:9,color:'#ffffff'},bgcolor:'#161b22',bordercolor:'#58a6ff',borderwidth:1,borderpad:2,
    xanchor:'right',yanchor:'bottom'});
  // Vertical lines at midnight boundaries with date labels
  // Compute local midnight using timezone-aware formatting to find the UTC offset
  const localDateStr=now.toLocaleDateString('en-CA',{timeZone:'__TIMEZONE__'}); // YYYY-MM-DD
  const localMidnight=new Date(localDateStr+'T00:00:00');
  // Adjust: find actual UTC time of local midnight by comparing formatted date
  const tzOffset=now.getTime()-localMidnight.getTime(); // rough; refine by finding exact midnight
  // More reliable: format hour to get timezone offset
  const localHour=parseInt(now.toLocaleString('en-US',{timeZone:'__TIMEZONE__',hour:'numeric',hour12:false}));
  const localMin=parseInt(now.toLocaleString('en-US',{timeZone:'__TIMEZONE__',minute:'numeric'}));
  const msSinceMidnight=(localHour*60+localMin)*60000+now.getSeconds()*1000+now.getMilliseconds();
  const todayMidnight=new Date(now.getTime()-msSinceMidnight);
  for(const d of [1,3,7]){
    const m=new Date(todayMidnight.getTime()-(d-1)*86400000);
    const h=(now-m)/3600000;
    if(h<=0||h>=HA_MAX)continue;
    const lx=Math.log10(h);
    // Vertical line
    ann.push({x:lx,y:0,xref:'x',yref:'paper',ax:lx,ay:1,axref:'x',ayref:'paper',
      showarrow:true,arrowhead:0,arrowwidth:1,arrowcolor:'#58a6ff60'});
    // Boxed date label — same height as "now" label
    ann.push({x:lx,y:0.95,xref:'x',yref:'paper',
      text:m.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'__TIMEZONE__'}),
      showarrow:false,
      font:{size:9,color:'#58a6ff'},bgcolor:'#161b22',bordercolor:'#58a6ff60',borderwidth:1,borderpad:2,
      yanchor:'bottom'});
  }
  const el=document.getElementById(divId);
  const prevX=el&&el.layout&&el.layout.xaxis?el.layout.xaxis.range:null;
  const prevY=el&&el.layout&&el.layout.yaxis?el.layout.yaxis.range:null;
  const prevY2=el&&el.layout&&el.layout.yaxis2?el.layout.yaxis2.range:null;
  const xRange=prevX||[Math.log10(HA_MAX),Math.log10(HA_MIN)];
  const layout={
    title:{text:title,font:{color:'#e6edf3',size:13},x:0.02,xanchor:'left',y:0.95,yanchor:'top'},
    paper_bgcolor:'#161b22',plot_bgcolor:'#0d1117',font:{color:'#8b949e',size:10},
    xaxis:{type:'log',range:xRange,gridcolor:'#21262d',linecolor:'#30363d',tickvals:TICKS,ticktext:TICKS.map(fmtAgo),title:{text:'\u2190 past \u00b7 now \u2192',font:{size:11}}},
    yaxis:{gridcolor:'#21262d',linecolor:'#30363d',title:{text:yTitle},range:prevY||(()=>{
      const xLo=Math.min(...xRange),xHi=Math.max(...xRange);
      if(mode==='ctx'){
        // Context: simple max of all traces in visible range
        let mx=1;for(const t of traces)for(let i=0;i<t.x.length;i++){
          const lx=Math.log10(t.x[i]);if(lx>=xLo&&lx<=xHi&&t.y[i]>mx)mx=t.y[i];}
        return[0,mx*1.1];
      }
      // Stacked: sum per x-index
      const stk=traces.filter(t=>t.stackgroup==='tokens');
      let mx=1;if(stk.length&&stk[0].x){for(let i=0;i<stk[0].x.length;i++){
        const lx=Math.log10(stk[0].x[i]);if(lx<xLo||lx>xHi)continue;
        let s=0;for(const t of stk)s+=(t.y[i]||0);if(s>mx)mx=s;}}
      return[0,mx*1.1];
    })(),side:'left'},
    yaxis2:{overlaying:'y',side:'right',gridcolor:'transparent',visible:mode!=='ctx',title:{text:y2Title,font:{color:'#ffffff'}},range:prevY2||(()=>{
      const xLo=Math.min(...xRange),xHi=Math.max(...xRange);
      let mx=0.01;for(const t of traces){if(t.yaxis!=='y2')continue;for(let i=0;i<t.x.length;i++){
        const lx=Math.log10(t.x[i]);if(lx>=xLo&&lx<=xHi)mx=Math.max(mx,t.y[i]);}}
      return[0,mx*1.1];
    })(),tickprefix:'$',tickformat:'.2f',tickfont:{color:'#ffffff',size:9},showgrid:false,ticksuffix:'  '},
    height:240,margin:{t:35,b:55,l:65,r:65},hovermode:'x unified',
    showlegend:mode==='ctx',legend:{font:{size:9,color:'#8b949e'},orientation:'h',y:-0.25},annotations:ann
  };
  Plotly.react(divId,traces,layout,{responsive:true,scrollZoom:true,displayModeBar:true,modeBarButtonsToRemove:['lasso2d','select2d']});
  // Auto-fit y-axis to visible x-range on zoom/pan
  const plotEl=document.getElementById(divId);
  if(plotEl&&!plotEl._hasRelayout){
    plotEl._hasRelayout=true;
    plotEl.on('plotly_relayout',function(ev){
      if(!ev['xaxis.range[0]']&&!ev['xaxis.range[1]'])return;
      const xlo=ev['xaxis.range[0]']??layout.xaxis.range[0];
      const xhi=ev['xaxis.range[1]']??layout.xaxis.range[1];
      // Sum stacked traces per x-index in visible range to find true visual max
      const stk=plotEl.data.filter(t=>t.stackgroup==='tokens');
      const xMin=Math.min(xlo,xhi),xMax=Math.max(xlo,xhi);
      let ymax=0,y2max=0;
      if(stk.length&&stk[0].x){
        for(let i=0;i<stk[0].x.length;i++){
          const lx=Math.log10(stk[0].x[i]);
          if(lx>=xMin&&lx<=xMax){let s=0;for(const t of stk)s+=(t.y[i]||0);if(s>ymax)ymax=s;}
        }
      }
      for(const tr of plotEl.data){
        if(tr.yaxis!=='y2')continue;
        for(let i=0;i<tr.x.length;i++){
          const lx=Math.log10(tr.x[i]);
          if(lx>=xMin&&lx<=xMax)y2max=Math.max(y2max,tr.y[i]);
        }
      }
      if(ymax>0)Plotly.relayout(divId,{'yaxis.range':[0,ymax*1.1],'yaxis2.range':[0,Math.max(0.01,y2max*1.1)]});
    });
  }
}

function makeTable(rows,title,nameCol){
  const hrs=7*24;
  let h=`<div style="color:var(--muted);font-size:10px;margin-bottom:4px">${title||'7-Day Rolling Totals'}</div>`;
  h+=`<table><tr><th></th><th>${nameCol||'Name'}</th><th>Input</th><th>Output</th><th>Cache Write</th><th>Cache Read</th><th>Total</th><th>tok/hr</th><th>Cost</th><th>$/hr</th></tr>`;
  let sumI=0,sumO=0,sumCW=0,sumCR=0,sumCost=0;
  for(const r of rows){
    const total=r.i+r.o+r.cw;
    const color=r.color||DC;
    const tokHr=~~(total/hrs);
    sumI+=r.i;sumO+=r.o;sumCW+=r.cw;sumCR+=r.cr;sumCost+=r.cost;
    h+=`<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color}"></span></td><td>${r.n}</td><td class=n>${fmtNum(r.i)}</td><td class=n>${fmtNum(r.o)}</td><td class=n>${fmtNum(r.cw)}</td><td class=n>${fmtNum(r.cr)}</td><td class=n>${fmtNum(total)}</td><td class=n>${fmtNum(tokHr)}</td><td class=n>$${r.cost.toFixed(2)}</td><td class=n>$${(r.cost/hrs).toFixed(4)}</td></tr>`;
  }
  if(rows.length>1){
    const sumTotal=sumI+sumO+sumCW;
    h+=`<tr style="font-weight:bold;border-top:2px solid var(--border)"><td></td><td>Total</td><td class=n>${fmtNum(sumI)}</td><td class=n>${fmtNum(sumO)}</td><td class=n>${fmtNum(sumCW)}</td><td class=n>${fmtNum(sumCR)}</td><td class=n>${fmtNum(sumTotal)}</td><td class=n>${fmtNum(~~(sumTotal/hrs))}</td><td class=n>$${sumCost.toFixed(2)}</td><td class=n>$${(sumCost/hrs).toFixed(4)}</td></tr>`;
  }
  return h+'</table>';
}

const _tabState={};
function switchTab(secId,field,mode,btn){
  _tabState[secId]={field,mode};
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const sec=document.getElementById(secId);
  if(!sec)return;
  const plotDiv=sec.querySelector('.plot-div');
  if(!plotDiv)return;
  makePlot(plotDiv.id,plotDiv.dataset.title,JSON.parse(plotDiv.dataset.series),field,mode);
}

async function load(preloaded){
  const DATA=preloaded||await fetch(BASE+'/tokens/data.json'+location.search).then(r=>r.json());
  const allKeys=Object.keys(DATA).filter(k=>!k.startsWith('_'));
  const botKeys=allKeys.filter(k=>!k.startsWith('operator/'));
  const opKeys=allKeys.filter(k=>k.startsWith('operator/'));
  if(!allKeys.length){document.getElementById('content').innerHTML='<p>No token data yet. Data appears after bots run containers.</p>';return;}

  // Group by ship and role
  const ships={},roles={};
  for(const[bot,d]of Object.entries(DATA)){
    if(bot.startsWith('_'))continue;
    const sh=d.ship||'Unknown',ro=d.role||'unknown';
    if(!ships[sh])ships[sh]={entries:[],agg:{i:0,o:0,cw:0,cr:0,cost:0},bots:[],opBots:[]};
    if(!roles[ro])roles[ro]={entries:[],agg:{i:0,o:0,cw:0,cr:0,cost:0},bots:[]};
    ships[sh].entries.push(...d.entries);
    if(bot.startsWith('operator/'))ships[sh].opBots.push(bot); else ships[sh].bots.push(bot);
    roles[ro].entries.push(...d.entries);roles[ro].bots.push(bot);
    for(const v of Object.values(d.aggregate)){
      ships[sh].agg.i+=v.input;ships[sh].agg.o+=v.output;ships[sh].agg.cw+=(v.cache_write||0);ships[sh].agg.cr+=(v.cache_read||0);ships[sh].agg.cost+=(v.cost||0);
      roles[ro].agg.i+=v.input;roles[ro].agg.o+=v.output;roles[ro].agg.cw+=(v.cache_write||0);roles[ro].agg.cr+=(v.cache_read||0);roles[ro].agg.cost+=(v.cost||0);
    }
  }

  let html='';
  // Pricing table
  const pricing=DATA._pricing||{};
  if(Object.keys(pricing).length){
    let pt='<div class="section" id="sec-pricing"><h2>Token Pricing ($/M tokens)</h2><table><tr><th>Model</th><th>Input</th><th>Output</th><th>Cache Write</th><th>Cache Read</th><th>Updated</th></tr>';
    for(const[model,p]of Object.entries(pricing)){
      const c=MC[model.split('/')[1]]||DC;
      pt+=`<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c}"></span> ${model}</td><td class=n>$${p.input.toFixed(2)}</td><td class=n>$${p.output.toFixed(2)}</td><td class=n>$${p.cache_write.toFixed(2)}</td><td class=n>$${p.cache_read.toFixed(2)}</td><td class=n>${p.updated||'—'}</td></tr>`;
    }
    html+=pt+'</table></div>';
  }
  let nav='<h3>Navigation</h3><a href="#livestream-card" data-sec="livestream-card">Live Stream</a>';
  if(Object.keys(pricing).length)nav+='<a href="#sec-pricing" data-sec="sec-pricing">Pricing</a>';
  nav+='<a href="#sec-fleet" data-sec="sec-fleet">Fleet</a>';
  if(opKeys.length)nav+='<a href="#sec-operator" data-sec="sec-operator">Operator</a>';

  function tabsHtml(secId,isBot){
    const ctx=isBot?`<button class="tab-btn active" onclick="switchTab('${secId}','context','ctx',this)">Context</button>`:'';
    const rateActive=isBot?'':'active';
    return `<div class="tab-bar">
      ${ctx}
      <button class="tab-btn ${rateActive}" onclick="switchTab('${secId}','total','rate',this)">Rate</button>
      <button class="tab-btn" onclick="switchTab('${secId}','total','cum',this)">Total</button>
      <button class="tab-btn" onclick="switchTab('${secId}','input','cum',this)">Input</button>
      <button class="tab-btn" onclick="switchTab('${secId}','output','cum',this)">Output</button>
      <button class="tab-btn" onclick="switchTab('${secId}','cache_write','cum',this)">Cache Write</button>
      <button class="tab-btn" onclick="switchTab('${secId}','cache_read','cum',this)">Cache Read</button>
    </div>`;
  }

  function aggForBot(bot){
    let a={i:0,o:0,cw:0,cr:0,cost:0};
    for(const v of Object.values(DATA[bot].aggregate)){a.i+=v.input;a.o+=v.output;a.cw+=(v.cache_write||0);a.cr+=(v.cache_read||0);a.cost+=(v.cost||0);}
    return a;
  }

  // Fleet section — one trace per ship, aggregated via union grid
  const fleetSeries={};
  for(const[sh,d]of Object.entries(ships)){
    const allBots=[...d.bots,...d.opBots];
    fleetSeries[sh]={botEntries:allBots.map(b=>DATA[b].entries),color:shipColor(sh)};
  }
  const fleetTbl=Object.entries(ships).map(([n,d])=>({n,...d.agg}));
  html+=`<div class="section" id="sec-fleet"><h2>Fleet Overview</h2>${tabsHtml('sec-fleet')}
    <div class="card"><div id="plot-fleet" class="plot-div" data-title="Fleet — All Ships" data-series='${JSON.stringify(fleetSeries)}'></div></div>
    ${makeTable(fleetTbl,'7-Day Rolling Totals — Fleet','Ship')}</div>`;

  // Operator section — breakdown per system
  if(opKeys.length){
    const opSeries={};
    for(const k of opKeys){
      const label=k.replace('operator/','');
      opSeries[label]={entries:DATA[k].entries,color:shipColor(label)};
    }
    const opTbl=opKeys.map(k=>{const a=aggForBot(k);return{n:k.replace('operator/',''),...a};});
    html+=`<div class="section" id="sec-operator"><h2>Operator</h2>${tabsHtml('sec-operator')}
      <div class="card"><div id="plot-operator" class="plot-div" data-title="Operator — Per System" data-series='${JSON.stringify(opSeries)}'></div></div>
      ${makeTable(opTbl,'7-Day Rolling Totals — Operator')}</div>`;
  }

  // Ship sections
  nav+='<h3>Ships</h3>';
  for(const[sh,d]of Object.entries(ships)){
    const id='sec-ship-'+sh.replace(/\W/g,'');
    nav+=`<a href="#${id}" data-sec="${id}">${sh}</a>`;
    const series={};
    for(const bot of d.bots)series[bot]={entries:DATA[bot].entries,color:MC[DATA[bot].entries[0]?.model]||DC};
    if(d.opBots.length)for(const ob of d.opBots)series['operator']={entries:DATA[ob].entries,color:'#da3633'};
    const tbl=d.bots.map(bot=>({n:cap(bot),...aggForBot(bot),color:MC[DATA[bot].entries[0]?.model]||DC}));
    html+=`<div class="section" id="${id}"><h2>${sh}</h2>${tabsHtml(id)}
      <div class="card"><div id="plot-${id}" class="plot-div" data-title="${sh}" data-series='${JSON.stringify(series)}'></div></div>
      ${makeTable(tbl,'7-Day Rolling Totals — '+sh,'Bot')}</div>`;
  }

  // Role sections (exclude operator role)
  nav+='<h3>Roles</h3>';
  for(const[ro,d]of Object.entries(roles)){
    if(ro==='operator')continue;
    const id='sec-role-'+ro;
    nav+=`<a href="#${id}" data-sec="${id}">${cap(ro)}</a>`;
    const series={};
    for(const bot of d.bots){
      if(bot.startsWith('operator/'))continue;
      series[cap(bot)]={entries:DATA[bot].entries,color:MC[DATA[bot].entries[0]?.model]||DC};
    }
    const tbl=d.bots.filter(b=>!b.startsWith('operator/')).map(bot=>({n:cap(bot),...aggForBot(bot)}));
    html+=`<div class="section" id="${id}"><h2>${cap(ro)}</h2>${tabsHtml(id)}
      <div class="card"><div id="plot-${id}" class="plot-div" data-title="${cap(ro)}" data-series='${JSON.stringify(series)}'></div></div>
      ${makeTable(tbl,'7-Day Rolling Totals — '+cap(ro))}</div>`;
  }

  // Bot sections (exclude operator pseudo-bots)
  nav+='<h3>Bots</h3>';
  for(const bot of botKeys.sort()){
    const d=DATA[bot];
    const id='sec-bot-'+bot;
    nav+=`<a href="#${id}" data-sec="${id}">${cap(bot)}</a>`;
    // One trace per model, each with its own color
    const series={};
    const byModel={};
    for(const e of d.entries){const m=e.model||'?';if(!byModel[m])byModel[m]=[];byModel[m].push(e);}
    for(const[m,entries]of Object.entries(byModel))series[m]={entries,color:MC[m]||DC};
    const tbl=Object.entries(d.aggregate).map(([m,v])=>{const model=m.split('/')[1]||m;return{n:m,i:v.input,o:v.output,cw:v.cache_write||0,cr:v.cache_read||0,cost:v.cost||0,color:MC[model]||DC};});
    html+=`<div class="section" id="${id}"><h2>${cap(bot)} <span class="muted">${d.ship||''} · ${cap(d.role||'')}</span></h2>${tabsHtml(id,true)}
      <div class="card"><div id="plot-${id}" class="plot-div" data-title="${cap(bot)}" data-series='${JSON.stringify(series)}'></div></div>
      ${makeTable(tbl,'7-Day Rolling Totals — '+cap(bot),'Model')}</div>`;
  }

  document.getElementById('content').innerHTML=html;
  document.getElementById('sidebar').innerHTML=nav;
  // Sidebar: scroll to target section
  document.querySelectorAll('.sidebar a[data-sec]').forEach(a=>{
    a.addEventListener('click',function(e){
      e.preventDefault();
      const target=document.getElementById(this.dataset.sec);
      if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
  document.getElementById('ts').textContent=new Date().toISOString();

  // Render all plots (data is fast from SQLite — no need for lazy render)
  const renderPlot=(div)=>{
    div.dataset.rendered='1';
    const sec=div.closest('.section');
    const state=sec&&_tabState[sec.id];
    const isBot=sec&&sec.id.startsWith('sec-bot-');
    const field=state?state.field:(isBot?'context':'total');
    const mode=state?state.mode:(isBot?'ctx':'rate');
    makePlot(div.id,div.dataset.title,JSON.parse(div.dataset.series),field,mode);
    if(state&&sec){
      const btns=sec.querySelectorAll('.tab-btn');
      btns.forEach(b=>b.classList.remove('active'));
      const labels={'total_rate':'Rate','total_cum':'Total','input_cum':'Input','output_cum':'Output','cache_write_cum':'Cache Write','cache_read_cum':'Cache Read'};
      const target=labels[field+'_'+mode];
      btns.forEach(b=>{if(b.textContent===target)b.classList.add('active');});
    }
  };
  document.querySelectorAll('.plot-div').forEach(renderPlot);

  // Sidebar active state: highlight the section closest to the top of .main
  const navLinks=document.querySelectorAll('.sidebar a[data-sec]');
  document.getElementById('main').addEventListener('scroll',function(){
    const mainTop=this.getBoundingClientRect().top;
    let best=null,bestDist=Infinity;
    document.querySelectorAll('.section').forEach(s=>{
      const d=Math.abs(s.getBoundingClientRect().top-mainTop);
      if(d<bestDist){bestDist=d;best=s.id;}
    });
    if(best){
      navLinks.forEach(a=>a.classList.remove('active'));
      const link=document.querySelector(`.sidebar a[data-sec="${best}"]`);
      if(link)link.classList.add('active');
    }
  });
}
load();
// Auto-refresh: re-render on data change, or just update plots for time shift
const REFRESH_MS=__REFRESH_MS__;
let _lastDataHash='';
let _lastRenderTime=Date.now();
const FORCE_RENDER_MS=__FORCE_RENDER_MS__;
if(REFRESH_MS>0)setInterval(async()=>{
  try{
    const resp=await fetch(BASE+'/tokens/data.json'+location.search);
    const text=await resp.text();
    const dataChanged=text!==_lastDataHash;
    const forceRender=Date.now()-_lastRenderTime>FORCE_RENDER_MS;
    if(!dataChanged&&!forceRender)return;
    if(dataChanged){
      // Data changed — full reload
      _lastDataHash=text;
      _lastRenderTime=Date.now();
      const m=document.getElementById('main');
      const scrollTop=m?m.scrollTop:0;
      await load(JSON.parse(text));
      if(m)m.scrollTop=scrollTop;
    } else {
      // Time shift only — just re-render visible plots in place (no DOM rebuild)
      _lastRenderTime=Date.now();
      document.querySelectorAll('.plot-div').forEach(div=>{
        if(!div.dataset.rendered)return;
        const sec=div.closest('.section');
        const state=sec&&_tabState[sec.id];
        const isBot=sec&&sec.id.startsWith('sec-bot-');
        const field=state?state.field:(isBot?'context':'total');
        const mode=state?state.mode:(isBot?'ctx':'rate');
        makePlot(div.id,div.dataset.title,JSON.parse(div.dataset.series),field,mode);
      });
    }
  }catch{}
},REFRESH_MS);

// ── Live stream via SSE ──
const MC_SHORT={'claude-sonnet-4-6':'son','claude-opus-4-6':'opus','qwen3:14b':'qwen14','qwen3:30b':'qwen30'};
const stream=document.getElementById('livestream');
const evtSrc=new EventSource(BASE+'/tokens/stream');
evtSrc.onmessage=function(e){
  try{
    const rows=JSON.parse(e.data); // sorted oldest→newest; prepend makes newest on top
    // Clear placeholder
    if(stream.textContent==='Waiting for data...')stream.innerHTML='';
    const tz={timeZone:'__TIMEZONE__',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit',fractionalSecondDigits:1};
    const fmtTs=s=>s?new Date(s).toLocaleTimeString('en-US',tz):'';
    const dateFmt={timeZone:'__TIMEZONE__',month:'short',day:'numeric'};
    for(const r of rows){
      const isStart=!r.t_end;
      const m=r.model||'?';
      const rawEnd=r.t_end||r.t_start||'';
      const dateStr=rawEnd?new Date(rawEnd).toLocaleDateString('en-US',dateFmt):'';
      const tS=fmtTs(r.t_start);
      const tE=fmtTs(r.t_end);
      const sid=(r.session_id||'').slice(0,8);
      const tid=(r.turn_id||'').slice(0,8);
      // Date separator: when this entry's date differs from current top, prepend separator THEN entry
      const belowDate=stream.firstChild?.dataset?.date||'';
      if(dateStr&&belowDate&&dateStr!==belowDate){
        const sep=document.createElement('div');
        sep.style.cssText='color:var(--blue);font-size:10px;border-bottom:1px solid var(--border);padding:2px 0;margin:2px 0';
        sep.textContent='\u2500\u2500 '+dateStr+' \u2500\u2500';
        sep.dataset.date=dateStr;
        stream.prepend(sep);
      }
      const line=document.createElement('div');
      line.dataset.date=dateStr;
      line.style.cssText='white-space:nowrap;color:'+(isStart?'var(--muted)':'var(--text)');
      line.textContent=isStart
        ?`${tS}  ${(r.bot||'?').padEnd(8)} ${m} ${sid}/${tid} \u25B6 turn started`
        :`${tS}\u2192${tE}  ${(r.bot||'?').padEnd(8)} ${m} ${sid}/${tid} ctx=${fmtNum(r.context_tokens||0).padStart(6)} in=${String(r.input_tokens||0).padStart(6)} out=${String(r.output_tokens||0).padStart(6)} cw=${fmtNum(r.cache_write_tokens||0).padStart(6)} cr=${fmtNum(r.cache_read_tokens||0).padStart(6)}`;
      stream.prepend(line);
      while(stream.children.length>__MAX_STREAM_ROWS__)stream.lastChild.remove();
    }
  }catch{}
};
evtSrc.onerror=function(){/* reconnects automatically */};
</script>
